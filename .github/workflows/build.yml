name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: "Set up JDK"
      uses: actions/setup-java@v6
      with:
        distribution: "temurin"
        java-version: |
          8
          25
        cache: gradle
    - name: "Validate Gradle Wrapper"
      uses: gradle/actions/wrapper-validation@v6
    - name: "Build"
      run: ./gradlew build
    - name: "Upload JAR"
      uses: actions/upload-artifact@v7
      with:
        name: imgui
        path: build/libs/*.jar
        if-no-files-found: error
