name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: "Set up JDK 17"
      uses: actions/setup-java@v5
      with:
        java-version: "17"
        distribution: "temurin"
    - name: "Setup Gradle"
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
    - name: "Build"
      run: ./gradlew build
    - name: "Upload JAR"
      uses: actions/upload-artifact@v7
      with:
        name: imgui
        path: build/libs/*.jar
        if-no-files-found: error
